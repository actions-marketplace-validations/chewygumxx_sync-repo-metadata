name: Lint Commit Messages

on:
    push:
        branches: 
            - main
    pull_request:

permissions:
    contents: read
    pull-requests: read

jobs:
    commitlint:
        name:    Lint Commit Messages
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: wagoid/commitlint-github-action@v6
